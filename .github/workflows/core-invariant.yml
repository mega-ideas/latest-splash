# The non-custody invariant, enforced on every push and pull request.
#
# STATUS.md and SECURITY.md both cite this check as the evidence that Splash
# structurally cannot hold client funds. Until this workflow existed the check
# only ran when someone happened to type `npm run lint` locally — so the claim
# "CI-enforced" was not true. It is now.
#
# This job is deliberately narrow and has no external dependencies: it must stay
# green and fast enough that nobody is tempted to skip it.
name: core invariant

on:
  push:
    branches: [main, 'w*/**']
  pull_request:

jobs:
  no-client-value-in-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: splash_core holds no client value
        # The single most important check in the repository. If this fails, the
        # fix is to move the offending struct to move/splash_custody — never to
        # add an exception to the script.
        run: node scripts/check-core-no-balance.mjs

      - name: splash_spend can never rotate a spender or leak a permit
        # splash_spend publishes immutable and is the only code that can pull a
        # business's funds under an allowance. A permit or a Balance that
        # escapes it is escaped for ever (brief §3.4).
        run: node scripts/check-spend-permits.mjs

      - name: the invariant checker itself still catches what it claims to
        # A control that can be walked past is worse than no control, because it
        # gets quoted as evidence. These pin every bypass adversarial reviews
        # found: nested containers, aliased imports, multi-line fields,
        # single-line structs and subdirectories; then positional structs,
        # enums, generic holders, bags and dynamic fields; and, for
        # splash_spend, string literals that hid code, aliases, method calls,
        # out-parameters and money drawn but not settled. The compiled-module
        # cross-check runs in .github/workflows/move.yml, which builds.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
               --experimental-strip-types \
               --test tests/core-invariant-check.test.mjs tests/spend-permits-check.test.mjs
