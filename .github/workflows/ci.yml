# Lint, every test suite, and a production build — on every push and pull
# request.
#
# Until this workflow existed, the only thing CI ran was the core invariant.
# The commit protocol says lint and build must pass locally and not only in
# CI, which assumed CI ran them. It did not: a green check on a PR meant
# only that splash_core held no client value. It now means what it reads as.
#
# Node comes from .nvmrc, the same file package.json's engines field and the
# engine-strict install gate are pinned to. Change the version in one place.
#
# Every suite here runs with no external service: test:db uses PGlite
# in-process, and the build needs no environment variable set. If a step is
# added that needs a secret or a database, give it its own job rather than
# widening this one — this must stay green and fast enough that nobody is
# tempted to skip it.
name: ci

on:
  push:
    branches: [main, 'w*/**', 'feat/**']
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: install from the lockfile
        # --ignore-scripts: nothing in this tree needs a postinstall, and a
        # dependency that gains one should not get to run code in CI silently.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: lint
        # check:core, then check:copy, then eslint — the two custom guards
        # come first because they are the ones with the regulatory weight.
        run: npm run lint

      - name: test — every test file
        # `npm test` runs every tests/*.test.mjs. The named test:* scripts
        # used to be listed here one by one, and together they covered 41 of
        # 117 files; the other 76 never ran in CI. A new test now runs in CI
        # the moment it is committed, with nothing to remember.
        run: npm test

      - name: production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
